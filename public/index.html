<html>
<head>
  <title>Basic WebViewer</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <script src='/lib/webviewer/webviewer.min.js'></script>
</head>
<body>
<div id='viewer'></div>

<script>
  (function () {
    WebViewer({
      path: 'lib/webviewer',
      licenseKey: '<LICENSE_KEY>',
      preloadWorker: ['all']
    }, document.getElementById('viewer'))
        .then(async instance => {
          await instance.UI.loadDocument('https://apryse.s3.amazonaws.com/public/files/samples/WebviewerDemoDoc.pdf');

          setTimeout(async () => {
            await instance.UI.dispose();
            instance.Core.documentViewer.unmount();

            document.getElementById('viewer').remove();
          }, 5000)
        });
  })();
</script>
</body>
</html>
