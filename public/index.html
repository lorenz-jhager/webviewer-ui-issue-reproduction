<html>
<head>
  <title>Basic WebViewer</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <script src='/lib/webviewer/webviewer.min.js'></script>
</head>
<body>
<div id='viewer'></div>

<script>
  (function () {
    WebViewer({
      path: 'lib/webviewer',
      licenseKey: '<LICENSE_KEY>',
    }, document.getElementById('viewer'))
        .then(async instance => {
          const {UI} = instance;
          const {documentViewer, DocumentViewer} = instance.Core;

          documentViewer.getDisplayModeManager().enableVirtualDisplayMode();
          UI.setLayoutMode(UI.LayoutMode.Continuous)
          await UI.loadDocument('https://apryse.s3.amazonaws.com/public/files/samples/WebviewerDemoDoc.pdf');

          setTimeout(async () => {
            await UI.loadDocument('/file-1.pdf');
            documentViewer.setCurrentPage(7, false);
            // await UI.loadDocument('/file-2.pdf');
            // documentViewer.setCurrentPage(170, false);
          }, 2000)

          documentViewer.addEventListener(
            DocumentViewer.Events.PAGE_NUMBER_UPDATED,
            (page) => {
              console.log('PAGE_NUMBER_UPDATED: ' + page);
            }
          );
        });
  })();
</script>
</body>
</html>
